name: test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet build XrplFile.Libraries.slnf --configuration Release
      # Every test project in this repository is run by a job: XrplFile.Core.Tests,
      # XrplFile.Keys.Tests, XrplFile.App.Core.Tests and XrplFile.SitePrice.Tests here, the Core
      # suite's Integration-trait half in the "integration" job below, and web/test/*.test.mjs and
      # site/test/*.test.mjs by the node steps. A project the solution filter merely builds proves
      # nothing: XrplFile.Keys.Tests was built and never run from the day it was created, so the
      # 217 tests behind this branch's interoperability claim -- WalletCompatibilityTests above
      # all -- could not fail CI.
      # Category=Slow is excluded everywhere: the memory test (spec S27) runs for tens of minutes and
      # the 50 MB stand runs (Task 21) for longer. They are run by hand before a release.
      - run: dotnet run --project tests/XrplFile.Core.Tests --configuration Release --no-build -- -trait- "Category=Integration" -trait- "Category=Slow"
      - run: dotnet run --project tests/XrplFile.Keys.Tests --configuration Release --no-build -- -trait- "Category=Integration" -trait- "Category=Slow"
      - run: dotnet run --project tests/XrplFile.App.Core.Tests --configuration Release --no-build -- -trait- "Category=Integration" -trait- "Category=Slow"
      - run: dotnet run --project tests/XrplFile.SitePrice.Tests --configuration Release --no-build
      - run: node --test test/*.test.mjs
        working-directory: web
      # The site tests run from the repository root. They build their fixtures themselves; the
      # build step then proves the site assembles from the element that web/ just produced.
      - run: node --test site/test/*.test.mjs
      - run: node web/build.mjs
      - run: node site/build.mjs
      - name: the committed vectors are what the code produces
        run: |
          dotnet run --project tools/XrplFile.Vectors --configuration Release --no-build -- /tmp/v1.json
          diff /tmp/v1.json tests/vectors/v1.json

  integration:
    runs-on: ubuntu-latest
    # The stand suite is the longest Linux job, so it runs as two shards, each on its own runner
    # with its own stand. Shard "a" names its classes (about half the suite by measured time);
    # shard "b" runs every Integration class shard "a" does not name, so a new stand class can
    # never fall between the two -- it lands in "b" until someone moves it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            classes: >-
              -class XrplFile.Tests.PublicationSessionStandaloneTests
              -class XrplFile.Tests.BatchPublicationStandaloneTests
              -class XrplFile.Tests.BatchSigningStandaloneTests
              -class XrplFile.Tests.TransportStandaloneTests
              -class XrplFile.Tests.LiveTicketsStandaloneTests
              -class XrplFile.Tests.XrplClientLedgerSinkStandaloneTests
          - shard: b
            classes: >-
              -class- XrplFile.Tests.PublicationSessionStandaloneTests
              -class- XrplFile.Tests.BatchPublicationStandaloneTests
              -class- XrplFile.Tests.BatchSigningStandaloneTests
              -class- XrplFile.Tests.TransportStandaloneTests
              -class- XrplFile.Tests.LiveTicketsStandaloneTests
              -class- XrplFile.Tests.XrplClientLedgerSinkStandaloneTests
    name: integration (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build XrplFile.Libraries.slnf --configuration Release
      # A clean runner has ports 5005/5006/6006/6007 free, so the stand runs on the Compose
      # file's default ports and XRPL_FILE_NODE_URL keeps its ws://localhost:6006 default; the
      # docker-compose.local-ports.yml override is only needed on a host that already has
      # another rippled stand parked on those ports.
      - run: docker compose -p xrpl-file-ci -f .ci-config/docker-compose.ci.yml up -d
      - name: wait for the stand to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:5005 -H 'Content-Type: application/json' \
                 -d '{"method":"server_info","params":[{}]}' | grep -q '"status" *: *"success"'; then
              exit 0
            fi
            sleep 1
          done
          echo "the stand did not answer server_info within 60 s" >&2
          exit 1
      - run: dotnet run --project tests/XrplFile.Core.Tests --configuration Release --no-build -- -trait "Category=Integration" -trait- "Category=Slow" ${{ matrix.classes }}
      - if: always()
        run: docker compose -p xrpl-file-ci -f .ci-config/docker-compose.ci.yml down

  windows-app:
    runs-on: windows-latest
    # Installing the maui-windows workload took 367-456 s of a 10-13 minute job. The SDK is
    # installed into a directory of its own so that SDK and workload can be cached together;
    # bump the key's trailing number to force a fresh install.
    env:
      DOTNET_INSTALL_DIR: C:\dotnet-maui
    steps:
      - uses: actions/checkout@v4
      - id: dotnet-cache
        uses: actions/cache@v4
        with:
          path: C:\dotnet-maui
          key: dotnet-maui-windows-${{ runner.os }}-10.0-1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-windows
      - run: dotnet build app/XrplFile.App/XrplFile.App.csproj --configuration Release

  # A push to main is a release of the site: work lands on dev and reaches main by a merge, and that
  # merge publishes https://xrpl-file.staticbit.io. The job waits for "unit", which runs the web and
  # site suites and both builds, so a red suite never goes live. The slower integration and
  # windows-app jobs do not gate it: neither touches web/ or site/.
  deploy-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-latest
    # Two merges in quick succession deploy in order; cancelling the older run could leave the
    # earlier commit live if it finished last.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.1
      PROJECT: xrpl-file-site
    steps:
      # Without a token wrangler falls back to an interactive login and fails with a message that
      # does not name the missing secret.
      - name: the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to deploy the site" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node web/build.mjs
      - run: node site/build.mjs
      # In a non-interactive run, "pages deploy" fails on a missing project instead of offering to
      # create it, so the first deploy creates it here. A failed lookup (bad token) fails the job
      # rather than falling through to "create".
      - name: create the Pages project on first deploy
        run: |
          projects=$($WRANGLER pages project list --json)
          if ! printf '%s' "$projects" | grep -q "\"$PROJECT\""; then
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi
      - run: $WRANGLER pages deploy site/dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
