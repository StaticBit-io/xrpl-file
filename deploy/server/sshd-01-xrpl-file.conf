# Installed by deploy/server/setup.sh as /etc/ssh/sshd_config.d/01-xrpl-file.conf. The name sorts
# before Ubuntu's 50-cloud-init.conf, which turns password login on, and in sshd the first value of a
# keyword wins.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# The deploy key is in /etc/ssh/authorized_keys/deploy, owned by root: code run as deploy (a release
# candidate) cannot rewrite it and lift the forced command. root keeps its own file.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
